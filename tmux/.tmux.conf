# Базовая конфигурация tmux 3.x, без плагинов.
# Prefix: Ctrl-a, затем нужная клавиша.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Ctrl-a, Ctrl-a отправляет Ctrl-a программе внутри панели.

# Цвета и быстрая обработка Escape (удобно для Vim/Neovim).
set -g default-terminal "tmux-256color"
# True color для внешнего терминала с TERM=xterm-256color.
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on

# Мышь: выбор панелей, изменение размеров, прокрутка истории.
set -g mouse on
set -g history-limit 50000
set -g set-clipboard on

# Нумерация с 1; после закрытия окна номера уплотняются.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Новые окна и панели открываются в текущем каталоге.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Навигация между панелями: Prefix + стрелки.
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Навигация между панелями: Prefix + h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Размер панелей: Prefix + Ctrl-h/j/k/l; можно повторять сочетание.
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Закрыть текущую панель без подтверждения: Prefix + x.
bind x kill-pane

# Размер панелей: Prefix + H/J/K/L; можно повторять клавишу.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Копирование: Prefix + [, движение как в Vim,
# v — начать выделение, y — скопировать, q — выйти.
# Prefix + ] — вставить из буфера tmux.
# Системный буфер через OSC 52 зависит от поддержки терминала.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Перечитать конфигурацию: Prefix + r.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Простая строка состояния: сессия, окна, время.
set -g status-style "bg=colour235,fg=colour250"
set -g status-left " #[bold]#S#[default] "
set -g status-left-length 30
# WAIT виден, пока tmux ожидает команду после нажатия Prefix.
set -g status-right "#{?client_prefix,#[fg=colour220 bold]WAIT#[default] ,} %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=colour24,fg=colour255,bold] #I:#W #[default]"
